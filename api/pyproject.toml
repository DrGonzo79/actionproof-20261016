[project]
name = "actionproof-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.19",
    "fastapi==0.119.0",
    "uvicorn==0.37.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
